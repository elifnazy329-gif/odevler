<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Runner Dash - 3D Sonsuz Koşu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a3c1e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* HUD Arayüzü */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 10;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 18px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hud-card span {
            color: #f1c40f;
        }
        /* Menü Ekranları */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 12, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            color: white;
            text-align: center;
            padding: 20px;
        }
        .title {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #2ecc71;
            text-shadow: 0 4px 15px rgba(46, 204, 113, 0.4), 0 2px 0 #1b5e20;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 16px;
            color: #bdc3c7;
            margin-bottom: 30px;
            max-width: 400px;
        }
        .btn {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            border: none;
            color: white;
            padding: 16px 42px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.5);
            transition: transform 0.1s, background 0.2s;
            margin-top: 15px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .controls-hint {
            margin-top: 25px;
            background: rgba(255,255,255,0.1);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            color: #ecf0f1;
            line-height: 1.6;
        }
        /* Mobil Dokunmatik Butonlar */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(2, 65px);
            gap: 10px;
            z-index: 12;
            pointer-events: auto;
        }
        .m-btn {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
        }
        .m-btn:active {
            background: rgba(46, 204, 113, 0.6);
        }
        #btn-up { grid-column: 2; grid-row: 1; }
        #btn-left { grid-column: 1; grid-row: 2; }
        #btn-down { grid-column: 2; grid-row: 2; }
        #btn-right { grid-column: 3; grid-row: 2; }

        @media (max-width: 768px) {
            #mobile-controls { display: grid; }
            .title { font-size: 36px; }
        }
    </style>
    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <canvas id="canvas3d"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-card">SKOR: <span id="score-text">0m</span></div>
            <div class="hud-card">ALTIN: <span id="coins-text">0</span></div>
        </div>

        <!-- Başlangıç Ekranı -->
        <div id="start-screen" class="overlay">
            <div class="title">RUNNER DASH</div>
            <div class="subtitle">Ormandaki engellerden kaç, altınları topla ve en yüksek skoru yap!</div>
            <button class="btn" onclick="startGame()">OYUNA BAŞLA</button>
            <div class="controls-hint">
                <b>Kontroller:</b><br>
                ⬅️ ➡️ Sol / Sağ Şerit Değiştirme<br>
                ⬆️ Zıplama (Engellerin Üstünden)<br>
                ⬇️ Kayma (Kemerlerin Altından)
            </div>
        </div>

        <!-- Game Over Ekranı -->
        <div id="gameover-screen" class="overlay" style="display: none;">
            <div class="title" style="color: #e74c3c;">OYUN BİTTİ</div>
            <div class="subtitle" id="final-stats">Mesafe: 0m | Altın: 0</div>
            <button class="btn" onclick="restartGame()">TEKRAR OYNA</button>
        </div>

        <!-- Mobil Butonlar -->
        <div id="mobile-controls">
            <div class="m-btn" id="btn-up">⬆️</div>
            <div class="m-btn" id="btn-left">⬅️</div>
            <div class="m-btn" id="btn-down">⬇️</div>
            <div class="m-btn" id="btn-right">➡️</div>
        </div>
    </div>

    <script>
        // --- SES EFEKTLERİ (Web Audio API) ---
        const AudioCTX = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            if (AudioCTX.state === 'suspended') AudioCTX.resume();
            const now = AudioCTX.currentTime;

            if (type === 'swipe') {
                const osc = AudioCTX.createOscillator();
                const gain = AudioCTX.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.connect(gain); gain.connect(AudioCTX.destination);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'jump') {
                const osc = AudioCTX.createOscillator();
                const gain = AudioCTX.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(450, now + 0.2);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain); gain.connect(AudioCTX.destination);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'slide') {
                const osc = AudioCTX.createOscillator();
                const gain = AudioCTX.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.25);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain); gain.connect(AudioCTX.destination);
                osc.start(now); osc.stop(now + 0.25);
            } else if (type === 'coin') {
                const osc = AudioCTX.createOscillator();
                const gain = AudioCTX.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now); // B5
                osc.frequency.setValueAtTime(1318.51, now + 0.08); // E6
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain); gain.connect(AudioCTX.destination);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 'hit') {
                const osc = AudioCTX.createOscillator();
                const gain = AudioCTX.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain); gain.connect(AudioCTX.destination);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        // --- OYUN DEĞİŞKENLERİ ---
        let scene, camera, renderer;
        let playerGroup, playerBody, leftLeg, rightLeg;
        let isPlaying = false;
        let score = 0, coins = 0;
        let speed = 0.6;
        let currentLane = 1; // 0: Sol, 1: Orta, 2: Sağ
        const laneX = [-3.2, 0, 3.2];
        let targetX = 0;
        
        // Zıplama & Kayma
        let isJumping = false, jumpV = 0;
        let isSliding = false, slideTimer = 0;
        
        // Zemin ve Nesneler
        const roadTiles = [];
        const obstacles = [];
        const coinItems = [];
        const sideTrees = [];
        const ROAD_TILE_LEN = 100;
        let nextObstacleZ = 40;

        // --- KURULUM ---
        function init() {
            const container = document.getElementById('game-container');
            
            // Sahne
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 40, 220);

            // Kamera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, -8);
            camera.lookAt(0, 2, 10);

            // Render
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;

            // Işıklandırma
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x2e5a1c, 0.7);
            scene.add(hemiLight);

            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
            dirLight.position.set(20, 40, -20);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 50;
            dirLight.shadow.camera.bottom = -50;
            dirLight.shadow.camera.left = -30;
            dirLight.shadow.camera.right = 30;
            scene.add(dirLight);

            // İnsan Karakteri Oluştur
            createPlayer();

            // Zeminleri Oluştur (Kusursuz 3 parça döngü)
            for (let i = 0; i < 3; i++) {
                createRoadTile(i * ROAD_TILE_LEN);
            }

            // Etkinlik Dinleyicileri
            window.addEventListener('resize', onWindowResize);
            setupControls();

            // Döngüyü Başlat
            animate();
        }

        // --- İNSAN KARAKTERİ OLUŞTURMA ---
        function createPlayer() {
            playerGroup = new THREE.Group();

            // Materyaller
            const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
            const shirtMat = new THREE.MeshLambertMaterial({ color: 0x2980b9 });
            const pantsMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });

            // Gövde
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.1, 0.5), shirtMat);
            torso.position.y = 1.35;
            torso.castShadow = true;
            playerGroup.add(torso);

            // Baş
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), skinMat);
            head.position.y = 2.15;
            head.castShadow = true;
            playerGroup.add(head);

            // Bacaklar
            leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), pantsMat);
            leftLeg.position.set(-0.22, 0.4, 0);
            leftLeg.castShadow = true;

            rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.8, 0.3), pantsMat);
            rightLeg.position.set(0.22, 0.4, 0);
            rightLeg.castShadow = true;

            playerGroup.add(leftLeg);
            playerGroup.add(rightLeg);

            playerGroup.position.set(0, 0, 0);
            scene.add(playerGroup);
        }

        // --- ZEMİN VE AĞAÇLAR ---
        function createRoadTile(zPos) {
            const tileGroup = new THREE.Group();

            // Toprak Patika
            const roadGeo = new THREE.PlaneGeometry(10, ROAD_TILE_LEN);
            const roadMat = new THREE.MeshLambertMaterial({ color: 0x8d6e63 });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.z = ROAD_TILE_LEN / 2;
            road.receiveShadow = true;
            tileGroup.add(road);

            // Çim Kenarlıklar
            const grassGeo = new THREE.PlaneGeometry(30, ROAD_TILE_LEN);
            const grassMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
            
            const leftGrass = new THREE.Mesh(grassGeo, grassMat);
            leftGrass.rotation.x = -Math.PI / 2;
            leftGrass.position.set(-20, -0.01, ROAD_TILE_LEN / 2);
            tileGroup.add(leftGrass);

            const rightGrass = new THREE.Mesh(grassGeo, grassMat);
            rightGrass.rotation.x = -Math.PI / 2;
            rightGrass.position.set(20, -0.01, ROAD_TILE_LEN / 2);
            tileGroup.add(rightGrass);

            // Kenar Ağaçları
            for (let z = 10; z < ROAD_TILE_LEN; z += 15) {
                createTree(tileGroup, -8 - Math.random() * 6, z);
                createTree(tileGroup, 8 + Math.random() * 6, z);
            }

            tileGroup.position.z = zPos;
            scene.add(tileGroup);
            roadTiles.push(tileGroup);
        }

        function createTree(parent, x, z) {
            const treeGroup = new THREE.Group();
            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.5, 3),
                new THREE.MeshLambertMaterial({ color: 0x4e342e })
            );
            trunk.position.y = 1.5;
            treeGroup.add(trunk);

            const leaves = new THREE.Mesh(
                new THREE.ConeGeometry(2, 4, 8),
                new THREE.MeshLambertMaterial({ color: 0x1b5e20 })
            );
            leaves.position.y = 4;
            treeGroup.add(leaves);

            treeGroup.position.set(x, 0, z);
            parent.add(treeGroup);
        }

        // --- ENGEL VE ALTIN ÜRETİMİ ---
        function spawnObstaclePattern(zPos) {
            const type = Math.floor(Math.random() * 3);
            const lane = Math.floor(Math.random() * 3);

            if (type === 0) {
                // ÜSTÜNDEN ATLAMALI: Ağaç Kütüğü
                const log = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.4, 0.4, 2.8),
                    new THREE.MeshLambertMaterial({ color: 0x3e2723 })
                );
                log.rotation.z = Math.PI / 2;
                log.position.set(laneX[lane], 0.4, zPos);
                log.castShadow = true;
                log.userData = { type: 'JUMP', lane: lane };
                scene.add(log);
                obstacles.push(log);
            } else if (type === 1) {
                // ALTINDAN KAYMALI: Antik Kemer
                const archGroup = new THREE.Group();
                const pillarMat = new THREE.MeshLambertMaterial({ color: 0x7f8c8d });
                
                const leftP = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4, 0.4), pillarMat);
                leftP.position.set(-1.3, 2, 0);
                const rightP = new THREE.Mesh(new THREE.BoxGeometry(0.4, 4, 0.4), pillarMat);
                rightP.position.set(1.3, 2, 0);
                const topBeam = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 0.6), pillarMat);
                topBeam.position.set(0, 3.2, 0);

                archGroup.add(leftP); archGroup.add(rightP); archGroup.add(topBeam);
                archGroup.position.set(laneX[lane], 0, zPos);
                archGroup.userData = { type: 'SLIDE', lane: lane };
                scene.add(archGroup);
                obstacles.push(archGroup);
            } else {
                // YANA KAYMALI: Kaya
                const boulder = new THREE.Mesh(
                    new THREE.DodecahedronGeometry(1.2),
                    new THREE.MeshLambertMaterial({ color: 0x555555 })
                );
                boulder.position.set(laneX[lane], 1.2, zPos);
                boulder.castShadow = true;
                boulder.userData = { type: 'DODGE', lane: lane };
                scene.add(boulder);
                obstacles.push(boulder);
            }

            // Altınlar (Diğer Şeride)
            const coinLane = (lane + 1) % 3;
            for (let c = 0; c < 3; c++) {
                const coin = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.35, 0.35, 0.08, 16),
                    new THREE.MeshStandardMaterial({ color: 0xf1c40f, metalness: 0.8, roughness: 0.2 })
                );
                coin.rotation.x = Math.PI / 2;
                coin.position.set(laneX[coinLane], 1, zPos + (c * 3));
                coin.userData = { lane: coinLane };
                scene.add(coin);
                coinItems.push(coin);
            }
        }

        // --- KONTROLLER ---
        function setupControls() {
            document.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                if ((e.key === 'ArrowLeft' || e.key === 'a') && currentLane > 0) {
                    currentLane--; playSound('swipe');
                }
                if ((e.key === 'ArrowRight' || e.key === 'd') && currentLane < 2) {
                    currentLane++; playSound('swipe');
                }
                if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !isJumping) {
                    isJumping = true; jumpV = 0.35; playSound('jump');
                }
                if ((e.key === 'ArrowDown' || e.key === 's') && !isSliding) {
                    isSliding = true; slideTimer = 25; playSound('slide');
                }
            });

            // Mobil Dokunmatik
            document.getElementById('btn-left').onclick = () => { if (isPlaying && currentLane > 0) { currentLane--; playSound('swipe'); } };
            document.getElementById('btn-right').onclick = () => { if (isPlaying && currentLane < 2) { currentLane++; playSound('swipe'); } };
            document.getElementById('btn-up').onclick = () => { if (isPlaying && !isJumping) { isJumping = true; jumpV = 0.35; playSound('jump'); } };
            document.getElementById('btn-down').onclick = () => { if (isPlaying && !isSliding) { isSliding = true; slideTimer = 25; playSound('slide'); } };
        }

        // --- OYUN DÖNGÜSÜ ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Hızlanma
                speed += 0.0001;
                score += speed * 0.2;
                document.getElementById('score-text').innerText = Math.floor(score) + 'm';

                // Oyuncu Yana Hareket
                targetX = laneX[currentLane];
                playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2;

                // Zıplama Fizikleri
                if (isJumping) {
                    playerGroup.position.y += jumpV;
                    jumpV -= 0.02;
                    if (playerGroup.position.y <= 0) {
                        playerGroup.position.y = 0;
                        isJumping = false;
                    }
                }

                // Kayma Durumu
                if (isSliding) {
                    playerGroup.scale.set(1, 0.4, 1);
                    slideTimer--;
                    if (slideTimer <= 0) {
                        playerGroup.scale.set(1, 1, 1);
                        isSliding = false;
                    }
                }

                // Koşma Animasyonu
                if (!isJumping && !isSliding) {
                    const legAngle = Math.sin(Date.now() * 0.015) * 0.6;
                    leftLeg.rotation.x = legAngle;
                    rightLeg.rotation.x = -legAngle;
                }

                // Zemin Sonsuz Döngüsü
                roadTiles.forEach(tile => {
                    tile.position.z -= speed;
                    if (tile.position.z < -ROAD_TILE_LEN) {
                        tile.position.z += ROAD_TILE_LEN * 3;
                    }
                });

                // Engelleri Güncelle & Çarpışma Kontrolü
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    obs.position.z -= speed;

                    // Çarpışma Mesafesi
                    if (Math.abs(obs.position.z) < 1.2 && obs.userData.lane === currentLane) {
                        let hit = false;
                        if (obs.userData.type === 'JUMP' && playerGroup.position.y < 0.8) hit = true;
                        if (obs.userData.type === 'SLIDE' && !isSliding) hit = true;
                        if (obs.userData.type === 'DODGE') hit = true;

                        if (hit) {
                            gameOver();
                            return;
                        }
                    }

                    // Sahneden Çıkan Engelleri Sil
                    if (obs.position.z < -10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Altınları Güncelle
                for (let i = coinItems.length - 1; i >= 0; i--) {
                    const coin = coinItems[i];
                    coin.position.z -= speed;
                    coin.rotation.z += 0.05;

                    if (Math.abs(coin.position.z) < 1.2 && coin.userData.lane === currentLane && playerGroup.position.y < 2) {
                        scene.remove(coin);
                        coinItems.splice(i, 1);
                        coins++;
                        document.getElementById('coins-text').innerText = coins;
                        playSound('coin');
                    } else if (coin.position.z < -10) {
                        scene.remove(coin);
                        coinItems.splice(i, 1);
                    }
                }

                // Yeni Engel Oluştur
                nextObstacleZ -= speed;
                if (nextObstacleZ <= 0) {
                    spawnObstaclePattern(120);
                    nextObstacleZ = 22 + Math.random() * 8;
                }
            }

            renderer.render(scene, camera);
        }

        // --- OYUN DURUMLARI ---
        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            resetGame();
            isPlaying = true;
        }

        function gameOver() {
            playSound('hit');
            isPlaying = false;
            document.getElementById('final-stats').innerText = `Mesafe: ${Math.floor(score)}m | Altın: ${coins}`;
            document.getElementById('gameover-screen').style.display = 'flex';
        }

        function restartGame() {
            document.getElementById('gameover-screen').style.display = 'none';
            resetGame();
            isPlaying = true;
        }

        function resetGame() {
            score = 0; coins = 0; speed = 0.55; currentLane = 1;
            isJumping = false; isSliding = false;
            nextObstacleZ = 50;

            document.getElementById('score-text').innerText = '0m';
            document.getElementById('coins-text').innerText = '0';

            playerGroup.position.set(0, 0, 0);
            playerGroup.scale.set(1, 1, 1);

            // Temizle
            obstacles.forEach(o => scene.remove(o));
            coinItems.forEach(c => scene.remove(c));
            obstacles.length = 0;
            coinItems.length = 0;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
